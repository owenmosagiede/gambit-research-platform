name: Prepare controlled release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Match validation's allowance for the complete isolated suite.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install --require-hashes -r requirements-cloud.lock
      - name: Require passing isolated tests for this exact commit
        run: python tools/run_release_checks.py
      - name: Package verified source
        run: python tools/release_bundle.py build --output dist/gambit-${{ github.sha }}.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: |
            dist/*
            release-checks.json
          if-no-files-found: error
          retention-days: 30
      - name: Explain deployment boundary
        run: echo 'Tested artifact prepared. Production was not changed. Download this artifact and follow deploy/RELEASE_WORKFLOW.md.' >> "$GITHUB_STEP_SUMMARY"
