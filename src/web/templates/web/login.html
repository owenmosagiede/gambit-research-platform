<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Gambit Systems</title><link rel="icon" href="/public/gambit-app-mark.svg"><link rel="stylesheet" href="/public/site.css"></head><body><header><a class="brand" href="/">GAMBIT SYSTEMS</a></header><main class="login"><p class="eyebrow">Private workspace</p><h1>Sign in</h1>{% if limited %}<p class="error">Too many attempts. Please try again in 15 minutes.</p>{% endif %}<form method="post" action="/login/">{% csrf_token %}{{ form.non_field_errors }}<label for="id_username">Username</label>{{ form.username }}<label for="id_password">Password</label>{{ form.password }}<button type="submit">Sign in</button></form><p class="note">Access is restricted to the workspace owner.</p></main></body></html>
